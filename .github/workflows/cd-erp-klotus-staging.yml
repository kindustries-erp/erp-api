name: Build & Deploy API

on:
  push:
    branches:
      - erp-klotus-staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-klotus-api

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Elite
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ELITE_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write .env to Elite
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ vars.ELITE_PORT }} \
            ${{ vars.ELITE_USER }}@${{ vars.ELITE_HOST }} \
            "mkdir -p /opt/stacks/erp-klotus-staging-api && cat > /opt/stacks/erp-klotus-staging-api/.env" \
            <<< "${{ secrets.KLOTUS_STAGING_API_ENV }}
          R2_ACCOUNT_ID=${{ secrets.KLOTUS_STAGING_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.KLOTUS_STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.KLOTUS_STAGING_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.KLOTUS_STAGING_R2_BUCKET_NAME }}"

      - name: Guard deploy secrets
        run: |
          test -n "${{ secrets.GHCR_PAT }}" || (echo "GHCR_PAT missing" && exit 1)

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ vars.ELITE_PORT }} \
            ${{ vars.ELITE_USER }}@${{ vars.ELITE_HOST }} \
            "echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin ; \
             docker pull ${{ env.IMAGE_NAME }}:staging-${{ needs.build-and-push.outputs.sha }} || true ; \
             docker rm -f erp-api-klotus-staging || true ; \
             docker rm -f liouni-erp-core-api-klotus-staging || true ; \
             docker ps -q --filter publish=10021 | xargs -r docker rm -f || true ; \
             docker run -d --name erp-api-klotus-staging --restart always --env-file /opt/stacks/erp-klotus-staging-api/.env -e PORT=3000 -p 10021:3000 ${{ env.IMAGE_NAME }}:staging-${{ needs.build-and-push.outputs.sha }}"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ vars.ELITE_PORT }} \
            ${{ vars.ELITE_USER }}@${{ vars.ELITE_HOST }} \
            '
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10021/api/v1/auth/profile || true)
                if [ "$code" = "401" ] || [ "$code" = "200" ]; then
                  echo "✅ API health OK"
                  docker image prune -af
                  exit 0
                fi
                echo "Attempt $i: got $code, retrying..."
                sleep 3
              done
              echo "❌ Health check failed"
              exit 1
            '
