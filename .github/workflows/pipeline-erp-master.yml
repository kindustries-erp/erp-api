name: Pipeline API — erp-master via Komodo Elite

on:
  push:
    branches: [erp-master]
  pull_request:
    branches: [erp-master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-api-master
  MIGRATE_IMAGE_NAME: ghcr.io/kindustries-erp/erp-api-migrate
  KOMODO_API_STACK: erp-master-elite-api
  KOMODO_MIGRATE_STACK: erp-master-elite-migrate
  ELITE_API_URL: http://100.75.67.115:10020
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: Lint, Type & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bunx jest --forceExit
      - run: bun run build

  build-and-push:
    name: Build & Push immutable images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE_NAME }}:latest
            ${{ env.MIGRATE_IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate then deploy API through Komodo to Elite
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    env:
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
      KOMODO_URL: ${{ vars.KOMODO_URL }}
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Guard deployment configuration
        env:
          API_ENV: ${{ secrets.ERP_MASTER_API_ENV }}
        run: |
          set -euo pipefail
          test -n "$KOMODO_API_KEY"
          test -n "$KOMODO_API_SECRET"
          test -n "$KOMODO_URL"
          test -n "$API_ENV"
      - name: Write release references and runtime settings
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.sha }}
          API_ENV: ${{ secrets.ERP_MASTER_API_ENV }}
        run: |
          set -euo pipefail
          call() {
            curl --fail-with-body --silent --show-error -X POST "$KOMODO_URL$1" \
              -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' --data "$2"
          }
          api_image="${IMAGE_NAME}:${IMAGE_SHA}"
          migrate_image="${MIGRATE_IMAGE_NAME}:${IMAGE_SHA}"
          call /write/WriteStackFileContents "$(jq -n --arg stack "$KOMODO_API_STACK" --arg contents "ERP_API_IMAGE=$api_image" '{stack:$stack,file_path:".env",contents:$contents}')" >/dev/null
          call /write/WriteStackFileContents "$(jq -n --arg stack "$KOMODO_API_STACK" --arg contents "$API_ENV" '{stack:$stack,file_path:"application.env",contents:$contents}')" >/dev/null
          call /write/WriteStackFileContents "$(jq -n --arg stack "$KOMODO_MIGRATE_STACK" --arg contents "ERP_MIGRATE_IMAGE=$migrate_image" '{stack:$stack,file_path:".env",contents:$contents}')" >/dev/null
          call /write/WriteStackFileContents "$(jq -n --arg stack "$KOMODO_MIGRATE_STACK" --arg contents "$API_ENV" '{stack:$stack,file_path:"application.env",contents:$contents}')" >/dev/null
      - name: Run DB migration gate through Komodo
        run: |
          set -euo pipefail
          call() {
            curl --fail-with-body --silent --show-error -X POST "$KOMODO_URL$1" \
              -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' --data "$2"
          }
          call /execute/PullStack "$(jq -n --arg stack "$KOMODO_MIGRATE_STACK" '{stack:$stack}')" >/dev/null
          update="$(call /execute/RunStackService "$(jq -n --arg stack "$KOMODO_MIGRATE_STACK" '{stack:$stack,service:"migrate"}')")"
          update_id="$(jq -r '.id // ._id."$oid" // empty' <<<"$update")"
          test -n "$update_id"
          for i in $(seq 1 90); do
            state="$(call /read/GetUpdate "$(jq -nc --arg id "$update_id" '{id:$id}')")"
            status="$(jq -r '.status // empty' <<<"$state")"
            success="$(jq -r '.success // false' <<<"$state")"
            echo "migration $i/90: status=$status success=$success"
            if [ "$status" = Complete ]; then test "$success" = true; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Pull and deploy API through Komodo
        run: |
          set -euo pipefail
          call() {
            curl --fail-with-body --silent --show-error -X POST "$KOMODO_URL$1" \
              -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -H 'Content-Type: application/json' --data "$2"
          }
          call /execute/PullStack "$(jq -n --arg stack "$KOMODO_API_STACK" '{stack:$stack}')" >/dev/null
          call /execute/DeployStack "$(jq -n --arg stack "$KOMODO_API_STACK" '{stack:$stack}')" >/dev/null
      - name: Verify API on Elite Tailscale endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$ELITE_API_URL/api/v1/auth/profile" || true)"
            if [ "$code" = 401 ] || [ "$code" = 200 ]; then echo "API healthy: HTTP $code"; exit 0; fi
            echo "API attempt $i/36: HTTP $code"; sleep 5
          done
          exit 1
