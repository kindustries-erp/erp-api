name: Pipeline API — erp-master

on:
  push:
    branches: [erp-master]
  pull_request:
    branches: [erp-master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-api-master
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: Lint, Type & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (type + lint + prettier)
        run: bun run check:ci

      - name: Test
        run: bunx jest --forceExit

      - name: Build
        run: bun run build

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API SHA through Komodo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Connect Tailscale to Komodo MAIN
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Guard Komodo deployment settings
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
        run: |
          set -euo pipefail
          test -n "$KOMODO_API_KEY" || (echo "KOMODO_API_KEY missing" && exit 1)
          test -n "$KOMODO_API_SECRET" || (echo "KOMODO_API_SECRET missing" && exit 1)
          test -n "$KOMODO_URL" || (echo "KOMODO_URL missing" && exit 1)

      - name: Update API immutable image reference
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
          IMAGE_SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_NAME }}:${IMAGE_SHA}"
          payload="$(jq -n --arg stack "erp-master-demo-api" --arg image "$image" '{stack:$stack,file_path:".env",contents:("ERP_API_IMAGE=" + $image + "\n")}')"
          curl --fail-with-body --silent --show-error \
            -X POST "${KOMODO_URL}/write/WriteStackFileContents" \
            -H "$(printf 'X-Api-%s: %s' Key "$KOMODO_API_KEY")" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload" > komodo-write.json
          jq -e . komodo-write.json >/dev/null

      - name: Pull API image through Komodo
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${KOMODO_URL}/execute/PullStack" \
            -H "$(printf 'X-Api-%s: %s' Key "$KOMODO_API_KEY")" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"stack":"erp-master-demo-api"}' > komodo-pull.json
          jq -e . komodo-pull.json >/dev/null
          jq '{id,success,error,result}' komodo-pull.json

      - name: Deploy API through Komodo
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: ${{ vars.KOMODO_URL }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${KOMODO_URL}/execute/DeployStack" \
            -H "$(printf 'X-Api-%s: %s' Key "$KOMODO_API_KEY")" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"stack":"erp-master-demo-api"}' > komodo-deploy.json
          jq -e . komodo-deploy.json >/dev/null
          jq '{id,success,error,result}' komodo-deploy.json

      - name: Verify API runtime
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://100.69.94.117:10020/api/v1/auth/profile || true)"
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "API healthy: HTTP $code"; exit 0; fi
            echo "API attempt $i/30: HTTP $code"; sleep 5
          done
          exit 1
