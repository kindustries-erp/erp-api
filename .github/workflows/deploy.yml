name: Build & Deploy API

on:
  push:
    branches:
      - erp-klotus-staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kindustries-erp/erp-api

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Elite
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ELITE_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write .env to Elite
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.ELITE_PORT }} \
            ${{ secrets.ELITE_USER }}@${{ secrets.ELITE_HOST }} \
            "mkdir -p /opt/erp-klotus-staging && cat > /opt/erp-klotus-staging/.env" \
            <<< "${{ secrets.KLOTUS_STAGING_API_ENV }}"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.ELITE_PORT }} \
            ${{ secrets.ELITE_USER }}@${{ secrets.ELITE_HOST }} \
            "IMAGE_TAG=${{ needs.build-and-push.outputs.sha }} bash /opt/erp-klotus-staging/deploy-api.sh"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.ELITE_PORT }} \
            ${{ secrets.ELITE_USER }}@${{ secrets.ELITE_HOST }} \
            '
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10010/api/v1/auth/profile || true)
                if [ "$code" = "401" ]; then
                  echo "✅ API health OK"
                  exit 0
                fi
                echo "Attempt $i: got $code, retrying..."
                sleep 3
              done
              echo "❌ Health check failed"
              exit 1
            '
